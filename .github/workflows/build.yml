name: build

# Builds the three compiled executables for a release tag. The workflow uploads workflow
# artifacts only. It creates no release and holds no token (design 11.3, 11.4).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            exe: repo-tools-linux-x64
          - os: windows-latest
            target: bun-windows-x64
            exe: repo-tools-windows-x64.exe
          - os: macos-14
            target: bun-darwin-arm64
            exe: repo-tools-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tag must name the version that package.json holds, or the executables report
      # another version than the release they belong to.
      - name: tag equals package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts --compile --target=${{ matrix.target }}
      - run: bun scripts/smoke.ts -- bin/${{ matrix.exe }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: bin/${{ matrix.exe }}
          # One file, uploaded as-is (no zip). The artifact takes the file name.
          archive: false
          if-no-files-found: error

  checksums:
    needs: executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repo-tools-*
          path: bin
          merge-multiple: true
      - name: write and verify SHA256SUMS
        run: |
          cd bin
          sha256sum repo-tools-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: bin/SHA256SUMS
          archive: false
          if-no-files-found: error
