version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # NO DEPENDENCY-UPDATE ECOSYSTEM WORKS FOR A BUN-MANAGED DIRECTORY. Both options fail and each
  # error recommends the other, so the entry was REMOVED rather than left failing weekly:
  #   bun -> "Unsupported bun.lock 'lockfileVersion' 2" - its bundled bun reads v1, Bun 1.4 writes v2.
  #   npm -> "npm_and_yarn ecosystem cannot update bun.lock. Set package-ecosystem: bun" - this
  #          aborts during FILE FETCHING, so nothing is proposed for ANY directory in the entry.
  # npm_and_yarn worked until upstream added that abort between 2026-09-23 and 2026-09-25.
  # COST, AND IT IS LARGER HERE THAN IN THE SIBLING REPOS. Elsewhere the fleet note says security
  # ALERTS keep firing because they come from the dependency graph rather than the updater. THAT
  # IS NOT TRUE OF THIS REPOSITORY: Dependabot alerts are DISABLED here (the REST API answers
  # 403 "Dependabot alerts are disabled for this repository"), so with this entry gone there is
  # neither an alert nor a proposed fix. A bump is entirely a human action: `bun outdated`, then
  # `bun update <pkg>`, then commit the regenerated bun.lock. Enabling alerts is a repository
  # setting and is the owner's call, not this file's.
  # REVISIT, and it is checkable: re-add `package-ecosystem: bun` once its bundled bun reads
  # lockfileVersion 2. Set it, watch ONE scheduled run - the failure is immediate and costs nothing.
  # Do NOT pin Bun back to 1.3.14 for a v1 lockfile: that downgrades the toolchain around a vendor bug.
